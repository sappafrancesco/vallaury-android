plugins {
    id 'com.android.application'
}

android {
    namespace 'it.vallaury.app'
    compileSdk 36

    defaultConfig {
        applicationId 'it.vallaury.app'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            vcsInfo.include = false
        }
    }

    // No signed blob of dependency metadata inside the APK, and no repository details:
    // both make builds harder to reproduce and tell the user nothing.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
}
